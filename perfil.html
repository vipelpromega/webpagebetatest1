<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://avdssotwcftjuggsvubd.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>Perfil</title>
  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/fondo.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/fuerza.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/presencia.js"></script>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/motion.css">
  <link rel="stylesheet" href="css/fondos.css">
  <link rel="stylesheet" href="css/tarjeta.css">
  <link rel="stylesheet" href="css/perfil.css">
</head>
<body>
  <nav class="sidebar" aria-label="Navegación principal">
    <button type="button" class="side-btn" id="sidebar-toggle" aria-label="Expandir barra" data-tooltip="Expandir barra" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      <span class="label">Expandir</span>
    </button>
    <div class="side-divider" role="separator"></div>
    <a class="side-btn" href="index.html" aria-label="Principal" data-tooltip="Principal">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
      <span class="label">Principal</span>
    </a>
    <a class="side-btn" data-acceso="miembro" href="temporizador.html" aria-label="Temporizador" data-tooltip="Temporizador">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M9 2h6"/></svg>
      <span class="label">Temporizador</span>
    </a>
    <a class="side-btn bottom" href="configuracion.html" aria-label="Configuración" data-tooltip="Configuración">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span class="label">Configuración</span>
    </a>
  </nav>

  <div class="page">
    <header>
      <h1>Perfil</h1>
      <p id="perfil-sub">Información de la cuenta</p>
    </header>

    <main>
      <section class="card perfil-card" aria-live="polite">
        <div class="perfil-cab" id="perfil-cab" hidden>
          <span class="u-foto perfil-foto">
            <span class="u-avatar perfil-avatar" id="perfil-avatar" aria-hidden="true"></span>
            <span class="u-punto" id="perfil-punto" role="img" aria-label="En línea" hidden></span>
          </span>
          <div class="perfil-datos">
            <h2 id="perfil-nombre"></h2>
            <p class="perfil-usuario" id="perfil-usuario"></p>
            <p class="perfil-estado" id="perfil-estado"></p>
            <div class="perfil-seguim" id="perfil-seguim">
              <button type="button" class="perfil-stat" id="perfil-seguidores-btn" aria-haspopup="dialog">
                <span class="perfil-stat-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M2.8 19.3v-.5a3.8 3.8 0 0 1 3.8-3.8h4.8a3.8 3.8 0 0 1 3.8 3.8v.5"/><path d="M15.6 5.1a3.1 3.1 0 0 1 0 5.8"/><path d="M18.2 15.2a3.6 3.6 0 0 1 3 3.6v.5"/></svg></span><b id="perfil-seguidores-n">0</b><span class="perfil-stat-txt" id="perfil-seguidores-t">seguidores</span>
              </button>
              <button type="button" class="perfil-stat" id="perfil-amigos-btn" aria-haspopup="dialog">
                <span class="perfil-stat-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9.5" cy="7.5" r="3.5"/><path d="M3 19.5v-.6A3.9 3.9 0 0 1 6.9 15h3.8"/><path d="M17.8 20.8s-3.3-1.9-3.3-4.2a1.9 1.9 0 0 1 3.3-1.2 1.9 1.9 0 0 1 3.3 1.2c0 2.3-3.3 4.2-3.3 4.2z"/></svg></span><b id="perfil-amigos-n">0</b><span class="perfil-stat-txt" id="perfil-amigos-t">amigos</span>
              </button>
              <button type="button" class="perfil-stat" id="perfil-siguiendo-btn" aria-haspopup="dialog">
                <span class="perfil-stat-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9.5" cy="7.5" r="3.5"/><path d="M3 19.5v-.6A3.9 3.9 0 0 1 6.9 15h4.7"/><path d="M15 18h6M18.5 15.5L21 18l-2.5 2.5"/></svg></span><b id="perfil-siguiendo-n">0</b><span class="perfil-stat-txt" id="perfil-siguiendo-t">siguiendo</span>
              </button>
            </div>
          </div>
        </div>
        <dl class="perfil-extra" id="perfil-extra" hidden>
          <div><dt>Miembro desde</dt><dd id="perfil-desde"></dd></div>
        </dl>
        <p class="nota" id="perfil-msg" hidden></p>
        <div class="perfil-acciones">
          <a class="btn" id="perfil-editar" href="configuracion.html#cuenta" data-tooltip="Editar mi perfil" hidden><span class="btn-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17v3z"/><path d="M13.5 8.5l3 3"/></svg></span><span class="btn-txt">Editar mi perfil</span></a>
          <button class="btn" id="perfil-seguir" type="button" aria-pressed="false" hidden><span class="btn-ico" aria-hidden="true"></span><span class="btn-txt">Seguir</span></button>
          <button class="btn" id="perfil-amigo" type="button" aria-pressed="false" hidden><span class="btn-ico" aria-hidden="true"></span><span class="btn-txt">Agregar amigo</span></button>
          <button class="btn secondary" id="perfil-rechazar" type="button" hidden><span class="btn-ico" aria-hidden="true"></span><span class="btn-txt">Rechazar</span></button>
          <button class="btn secondary" id="perfil-mejor" type="button" aria-pressed="false" hidden><span class="btn-ico" aria-hidden="true"></span><span class="btn-txt">Mejor amigo</span></button>
          <button class="btn secondary" id="perfil-rechazar-mejor" type="button" hidden><span class="btn-ico" aria-hidden="true"></span><span class="btn-txt">Rechazar</span></button>
        </div>
      </section>
    </main>
  </div>

  <script src="js/tarjeta.js"></script>
  <script src="js/perfil.js"></script>
  <script src="js/preferencias.js"></script>
</body>
</html>
