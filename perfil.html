<body>
  <nav class="sidebar" aria-label="Navegación principal">
    <button type="button" class="side-btn" id="sidebar-toggle" aria-label="Expandir barra" data-tooltip="Expandir barra" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      <span class="label">Expandir</span>
    </button>
    <div class="side-divider" role="separator"></div>

    <a class="side-btn" data-acceso="miembro" href="temporizador.html" aria-label="Temporizador" data-tooltip="Temporizador">

  <div class="page">
    <header>
      <h1>Perfil</h1>
      <p id="perfil-sub">Información de la cuenta</p>
    </header>

    <main>
      <section class="card perfil-card" aria-live="polite">
        <div class="perfil-cab" id="perfil-cab" hidden>
          <span class="u-foto perfil-foto">
            <span class="u-avatar perfil-avatar" id="perfil-avatar" aria-hidden="true"></span>
            <span class="u-punto" id="perfil-punto" role="img" aria-label="En línea" hidden></span>
          </span>
          <div class="perfil-datos">
            <h2 id="perfil-nombre"></h2>
            <p class="perfil-usuario" id="perfil-usuario"></p>
            <p class="perfil-estado" id="perfil-estado"></p>
          </div>
        </div>
        <dl class="perfil-extra" id="perfil-extra" hidden>
          <div><dt>Miembro desde</dt><dd id="perfil-desde"></dd></div>
        </dl>
        <p class="nota" id="perfil-msg" hidden></p>
        <div class="perfil-acciones">
          <a class="btn" id="perfil-editar" href="configuracion.html#cuenta" hidden>Editar mi perfil</a>
          <a class="btn secondary" href="index.html">Volver a Principal</a>
        </div>
      </section>
    </main>
  </div>

  <script src="js/perfil.js"></script>
  <script src="js/preferencias.js"></script>

</html>
