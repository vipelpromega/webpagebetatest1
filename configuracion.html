<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configuración</title>
  <script src="js/theme.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/auth-config.js"></script>
  <script src="js/auth.js"></script>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/configuracion.css">
</head>
<body>
  <nav class="sidebar" aria-label="Navegación principal">
    <button type="button" class="side-btn" id="sidebar-toggle" aria-label="Expandir barra" data-tooltip="Expandir barra" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      <span class="label">Expandir</span>
    </button>
    <div class="side-divider" role="separator"></div>
    <a class="side-btn" href="index.html" aria-label="Casa" data-tooltip="Casa">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
      <span class="label">Casa</span>
    </a>
    <a class="side-btn" data-acceso="miembro" href="temporizador.html" aria-label="Temporizador" data-tooltip="Temporizador">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M9 2h6"/></svg>
      <span class="label">Temporizador</span>
    </a>
    <a class="side-btn bottom" href="configuracion.html" aria-label="Configuración" data-tooltip="Configuración" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span class="label">Configuración</span>
    </a>
  </nav>

  <div class="page">
    <header>
      <h1>⚙️ Configuración</h1>
      <p>Personaliza la página</p>
    </header>

    <main>
      <section class="card">
        <h2>Tema</h2>
        <div class="setting-row">
          <p>Elige cómo quieres ver la página. Se guarda en este navegador.</p>
          <div class="theme-options" role="group" aria-label="Tema">
            <button class="btn" data-theme-option="dark" aria-pressed="false">
              <span class="emoji" aria-hidden="true">🌙</span>
              Oscuro
            </button>
            <button class="btn" data-theme-option="light" aria-pressed="false">
              <span class="emoji" aria-hidden="true">☀️</span>
              Claro
            </button>
          </div>
        </div>
      </section>
      <section class="card cuenta">
        <h2>Cuenta</h2>
        <p class="muted" id="cuenta-info"></p>

        <div id="cuenta-miembro" hidden>
          <div class="f-group">
            <label class="f-label" for="nuevo-nombre">Nombre de visualización:</label>
            <div class="f-box">
              <input class="f-input" id="nuevo-nombre" type="text" maxlength="30" autocomplete="off">
            </div>
          </div>
          <p class="f-error" id="cuenta-msg" role="status"></p>
          <div class="cuenta-botones">
            <button class="btn" id="guardar-nombre" type="button">Guardar nombre</button>
            <button class="btn secondary" id="cerrar-sesion" type="button">Cerrar sesión</button>
          </div>
        </div>

        <div id="cuenta-invitado" hidden>
          <p>Estás como invitado: algunas secciones están limitadas.</p>
          <button class="btn" id="ir-registro" type="button" style="margin-top:.75rem">Registrarse o iniciar sesión</button>
        </div>
      </section>
    </main>

  </div>

  <script src="js/configuracion.js"></script>
</body>
</html>
