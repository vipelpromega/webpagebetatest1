<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Temporizador</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/temporizador.css">
</head>
<body>
  <nav class="sidebar" aria-label="Navegación principal">
    <a class="side-btn" href="index.html" aria-label="Casa" data-tooltip="Casa">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
    </a>
    <a class="side-btn" href="temporizador.html" aria-label="Temporizador" data-tooltip="Temporizador" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M9 2h6"/></svg>
    </a>
    <a class="side-btn bottom" href="configuracion.html" aria-label="Configuración" data-tooltip="Configuración">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </a>
  </nav>

  <div class="page">
    <header>
      <h1>⏱️ Temporizador</h1>
      <p>Cuenta regresiva simple</p>
    </header>

    <main>
      <section class="card">
        <div class="inputs" id="inputs">
          <label>Horas
            <input type="number" id="h" min="0" max="99" value="0" inputmode="numeric">
          </label>
          <label>Minutos
            <input type="number" id="m" min="0" max="59" value="5" inputmode="numeric">
          </label>
          <label>Segundos
            <input type="number" id="s" min="0" max="59" value="0" inputmode="numeric">
          </label>
        </div>

        <div class="display" id="display" role="timer" aria-live="off">00:05:00</div>
        <p class="status" id="status" aria-live="polite"></p>

        <div class="controls">
          <button class="btn" id="start">Iniciar</button>
          <button class="btn secondary" id="pause" disabled>Pausar</button>
          <button class="btn danger" id="reset">Reiniciar</button>
        </div>
      </section>
    </main>

    <footer>webpagebetatest1</footer>
  </div>

  <script src="js/temporizador.js"></script>
</body>
</html>
